# Exact held T15 / 60-chip BM1391 native SD candidate.
# Source command profile; physical hashing and rail qualification remain pending.
# Configure a pool and enable mining through dashboard setup.
# Support development: https://buymeacoffee.com/revjmoney
[general]
hostname = "dcentos-t15"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false
model = "t15"
frequency_mhz = 100
voltage_mv = 18000
version_rolling = false
passthrough = false
suggest_difficulty = 256
serial_chip_count = 60
serial_chip_type = "BM1391"

[power]
mode = "bypass"
target_watts = 0

[thermal]
target_temp_c = 55
hot_temp_c = 65
dangerous_temp_c = 75
fan_min_pwm = 30
fan_max_pwm = 30

[api]
cgminer_port = 4028
http_port = 8080
websocket = true
cgminer_bind_lan = true
cgminer_lan_writes = false
metrics_require_auth = true

[donation]
# Voluntary, transparent dev-support donation for JMSCNC Heater OS.
# ON by default at 1% of hashing time (time-sliced, always visible on the
# dashboard). It mines to the Mining Dutch account revjmoney (account-based
# pool, so there is no single on-chain payout address). To disable it, set
# enabled = false (or percent = 0.0), or turn it off in Settings.
# The fallback is off and points at the same account as the primary.
enabled = true
percent = 1.0
pool_url = "stratum+tcp://americas.mining-dutch.nl:9996"
worker = "revjmoney.heateros"
password = "x"
fallback_enabled = false
fallback_pool_url = "stratum+tcp://americas.mining-dutch.nl:9996"
fallback_worker = "revjmoney.heateros"
fallback_password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = true
kick_interval_s = 5

[hash_on_disconnect]
enabled = false

[mode]
active = "standard"

[autotuner]
enabled = false

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
