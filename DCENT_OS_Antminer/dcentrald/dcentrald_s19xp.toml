# DCENT_OS dcentrald config for Antminer S19 XP (BM1366 family).
# Management-only evidence template. Exact ttyS3/ttyS2/ttyS1 routing is
# recorded separately; deployed-board, PIC/PSU, cooling, lifecycle, and
# persistent recovery authority remain unresolved.

[general]
hostname = "dcent-s19xp"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false
model = "s19xp"
frequency_mhz = 400
voltage_mv = 12800
version_rolling = true
passthrough = false
suggest_difficulty = 8192

serial_chip_count = 110
serial_chip_type = "BM1366"

[power]
mode = "bypass"
target_watts = 1600

[power.psu_override]
enabled = false
model = "APW12"
voltage_v = 14.0

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80
fan_min_pwm = 10
fan_max_pwm = 30  # home-quiet ceiling (was 40; PWM-30 is the shipped cap)

[api]
cgminer_port = 4028
http_port = 80
websocket = true
auth_enabled = false
auth_password = ""

[donation]
# Voluntary, transparent dev-support donation for JMSCNC Heater OS.
# ON by default at 1% of hashing time (time-sliced, always visible on the
# dashboard). It mines to the Mining Dutch account revjmoney (account-based
# pool, so there is no single on-chain payout address). To disable it, set
# enabled = false (or percent = 0.0), or turn it off in Settings.
# The fallback is off and points at the same account as the primary.
enabled = true
percent = 1.0
pool_url = "stratum+tcp://americas.mining-dutch.nl:9996"
worker = "revjmoney.heateros"
password = "x"
fallback_enabled = false
fallback_pool_url = "stratum+tcp://americas.mining-dutch.nl:9996"
fallback_worker = "revjmoney.heateros"
fallback_password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = false

[hash_on_disconnect]
enabled = false

[mode]
active = "standard"

[autotuner]
enabled = false
min_freq_mhz = 250
max_freq_mhz = 650

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
