# dcentrald.toml — Passthrough mode test (S9)
# Rides bosminer's existing ASIC/FPGA state. Proves heartbeat survives mining.

[general]
hostname = "dcentral-s9"
log_level = "debug"

[pool]
url = "stratum+tcp://solo.ckpool.org:3333"
worker = ""
password = "d=1"

[mining]
frequency_mhz = 650
voltage_mv = 9100
suggest_difficulty = 8192
passthrough = true
version_rolling = false

[power]
mode = "bypass"
target_watts = 0

[thermal]
target_temp_c = 55
hot_temp_c = 65
dangerous_temp_c = 75
fan_min_pwm = 10
fan_max_pwm = 30  # home-quiet ceiling; industrial 127 is not a shipped default

[api]
cgminer_port = 4029
http_port = 8080
websocket = true
auth_enabled = false
auth_password = ""

[donation]
# Voluntary, transparent dev-support donation for JMSCNC Heater OS.
# ON by default at 1% of hashing time (time-sliced, always visible on the
# dashboard). It mines to the Mining Dutch account revjmoney (account-based
# pool, so there is no single on-chain payout address). To disable it, set
# enabled = false (or percent = 0.0), or turn it off in Settings.
# The fallback is off and points at the same account as the primary.
enabled = true
percent = 1.0
pool_url = "stratum+tcp://americas.mining-dutch.nl:9996"
worker = "revjmoney.heateros"
password = "x"
fallback_enabled = false
fallback_pool_url = "stratum+tcp://americas.mining-dutch.nl:9996"
fallback_worker = "revjmoney.heateros"
fallback_password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = false

[hash_on_disconnect]
enabled = true

[mode]
active = "standard"

[autotuner]
enabled = false
