# Fork CI for the amlogic-s19jpro-home-build branch.
#
# - Cross-builds dcentrald / dcentos-init / dcentos-discovery for the S19j Pro
#   Amlogic control board (aarch64-unknown-linux-musl) with Zig 0.13.0 as the C
#   cross-compiler, and keeps the binaries as a downloadable artifact.
# - Runs the emu-twin BM1362 chain emulator tests and its end-to-end scenario.
#
# The full firmware image is NOT built here: it needs vendor kernel/DTB donor
# files that must never be committed or published. Build it locally.
name: Fork build

on:
  push:
    branches: [amlogic-s19jpro-home-build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dcentrald-aarch64:
    name: dcentrald · aarch64 musl cross-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DCENT_OS_Antminer/dcentrald
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.90.0
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: DCENT_OS_Antminer/dcentrald
          key: aarch64-musl
      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.13.0
      - name: Build (release, locked)
        run: |
          export ZIG_EXE="$(command -v zig)"
          export CC_aarch64_unknown_linux_musl="$PWD/zig-cc-aarch64.sh"
          export AR_aarch64_unknown_linux_musl="$PWD/zig-ar-aarch64.sh"
          cargo build --release --locked --target aarch64-unknown-linux-musl
      - name: Checksums
        run: |
          cd target/aarch64-unknown-linux-musl/release
          file dcentrald dcentos-init dcentos-discovery
          sha256sum dcentrald dcentos-init dcentos-discovery | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcentrald-aarch64-musl-${{ github.sha }}
          path: |
            DCENT_OS_Antminer/dcentrald/target/aarch64-unknown-linux-musl/release/dcentrald
            DCENT_OS_Antminer/dcentrald/target/aarch64-unknown-linux-musl/release/dcentos-init
            DCENT_OS_Antminer/dcentrald/target/aarch64-unknown-linux-musl/release/dcentos-discovery
            DCENT_OS_Antminer/dcentrald/target/aarch64-unknown-linux-musl/release/SHA256SUMS
          retention-days: 30

  runtime-policy:
    name: board_runtime_policy.json matches generator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DCENT_OS_Antminer/dcentrald
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: DCENT_OS_Antminer/dcentrald
          key: host
      - name: Regenerate and diff
        run: |
          cargo run --release --locked -q -p dcentrald-common --example export_runtime_policy > /tmp/policy.json
          diff -u ../docs/architecture/board_runtime_policy.json /tmp/policy.json

  emu-twin:
    name: emu-twin · chain emulator tests + e2e share
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DCENT_OS_Antminer/emu-twin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test suite
        run: python -m pytest tests/ -q
      - name: End-to-end scenario (real double-SHA256 share, toy difficulty)
        run: python harness/scenario_run.py --name ci-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: emu-twin-evidence-${{ github.sha }}
          path: DCENT_OS_Antminer/emu-twin/harness/evidence/
          if-no-files-found: ignore
          retention-days: 14
